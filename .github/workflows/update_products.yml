name: SmartGahr — Full Auto

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    environment: telegram
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # ── Content ──
      - name: Generate fresh content from products
        run: python feeder.py --source product_home.json --output content_home.json

      # ── Posting ──
      - name: Post deal to @smartgahr
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python poster.py

      # ── Referrals (one-shot stats) ──
      - name: Referral summary
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION_1: ${{ secrets.TELEGRAM_SESSION_1 }}
        run: python referral.py --oneshot || true

      # ── Report ──
      - name: Admin report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python reporting.py --daily || true

      # ── Deploy ──
      - name: Deploy Netlify redirector
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './netlify-redirector'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Auto ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      # ── Commit state ──
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in content_home.json content_home_posted.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || (git commit -m "Auto: CI cycle [skip ci]" && git push)
