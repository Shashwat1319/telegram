name: SmartGahr — Full Auto

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8,20 * * *'  # 2 posts/day: 8 AM + 8 PM IST
  workflow_dispatch:

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    environment: telegram
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Content ──
      - name: Generate fresh content from products
        run: python feeder.py --source product_home.json --output content_home.json

      # ── Website deals ──
      - name: Generate website deal pages
        env:
          CLICK_TRACKER_URL: https://budgetdeals-tracker-737523f4.netlify.app
        run: python website_gen.py --source product_home.json --out website/src/content/deals

      # ── Validate links ──
      - name: Validate all links
        run: python validate_links.py

      # ── Posting ──
      - name: Post deal to @smartgahr
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLICK_TRACKER_URL: https://budgetdeals-tracker-737523f4.netlify.app
        run: python poster.py

      # ── Referrals (one-shot stats) ──
      - name: Referral summary
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION_1: ${{ secrets.TELEGRAM_SESSION_1 }}
        run: python referral.py --oneshot || true

      # ── Report ──
      - name: Admin report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python reporting.py --daily || true

      # ── Deploy ──
      - name: Deploy Netlify redirector
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './netlify-redirector'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Auto ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Build website
        if: ${{ env.WEBSITE_ID != '' }}
        env:
          WEBSITE_ID: ${{ secrets.WEBSITE_NETLIFY_SITE_ID }}
        run: |
          cd website
          npm ci
          npm run build

      - name: Deploy Netlify website
        if: ${{ env.WEBSITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.WEBSITE_NETLIFY_SITE_ID }}
          WEBSITE_ID: ${{ secrets.WEBSITE_NETLIFY_SITE_ID }}
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './website/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Auto ${{ github.sha }}"
        timeout-minutes: 10

      # ── Commit state ──
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in content_home.json content_home_posted.json website/src/content/deals/*.md; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || (git commit -m "Auto: CI cycle [skip ci]" && git push)
