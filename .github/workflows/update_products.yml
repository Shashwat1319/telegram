# SINGLE-WRITER ARCHITECTURE (2026-10-24)
# ---------------------------------------------------------------
# The local orchestrator.py owns ALL posting + content generation:
#   feeder.py, poster.py, group_poster.py, referral listener,
#   reporting.py, promo_daily.py, member_* tasks.
# This workflow ONLY validates and deploys. It must NEVER post or
# regenerate content — dual writers fought over committed state files
# (content_*_posted.json), causing double-posts and merge conflicts.
# Uptime alarm = "no daily report on phone by ~09:30 IST" => check PC.
name: smartgahr — Validate & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: telegram
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Validate all links
        run: python validate_links.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Netlify redirector
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './netlify-redirector'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Auto ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Submit to IndexNow (Bing / AI engines)
        if: success()
        run: |
          KEY="b7c3e9f1a2d4658c9e0f1a2b3c4d5e6f"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"smartgahr.netlify.app\",\"key\":\"$KEY\",\"keyLocation\":\"https://smartgahr.netlify.app/$KEY.txt\",\"urlList\":[\"https://smartgahr.netlify.app/\",\"https://smartgahr.netlify.app/deals/\",\"https://smartgahr.netlify.app/kitchenfinds/\",\"https://smartgahr.netlify.app/about.html\",\"https://smartgahr.netlify.app/contact.html\",\"https://smartgahr.netlify.app/privacy.html\",\"https://smartgahr.netlify.app/disclaimer.html\",\"https://smartgahr.netlify.app/kitchenfinds/privacy.html\"]}" || true
          echo "IndexNow submission sent"

