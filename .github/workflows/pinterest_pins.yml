# Pinterest drip upload — runs in GitHub's cloud (laptop gets ZERO load).
# Uploads 6 deal pins/day total (3 per run x 2 runs) using pin_post.py; duplicate-safe via
# pins_pinned.json which is committed back after each run.
# Requires secret: PINTEREST_ACCESS_TOKEN in the "telegram" environment
# (environment must be declared below, otherwise the job receives it empty).
name: pinterest — daily pins

on:
  schedule:
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '30 12 * * *'  # 18:00 IST
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write          # commit pins_pinned.json state back

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PINTEREST_ACCESS_TOKEN lives under the "telegram" environment secret.
    # Without this line GitHub hands the job an empty string, the script
    # silently exits 0, and the drip stalls while runs stay green.
    environment: telegram
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pillow requests

      - name: Upload 3 pins
        id: upload
        continue-on-error: true
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python pin_post.py --daily 3

      # Always commit the run report (pinterest_status.json) so failures are
      # diagnosable from the repo without opening Actions logs.
      - name: Commit pin state (dedupe for next run)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pins_pinned.json
          [ -f pinterest_status.json ] && git add pinterest_status.json || true
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "chore(pinterest): pin state update [skip ci]"
          git push || (git pull --rebase --autostash && git push)

      - name: Print run report
        if: always()
        run: cat pinterest_status.json || echo "no status file written"

      - name: Fail if nothing was pinned
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::error::Pinterest upload failed — see pinterest_status.json / logs"
          exit 1
