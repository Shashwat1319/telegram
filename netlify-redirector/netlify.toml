[build]
  functions = "functions"
  publish = "."

[[redirects]]
  from = "/s/:id"
  to = "/.netlify/functions/go?id=:id"
  status = 200

[[redirects]]
  from = "/go"
  to = "/.netlify/functions/go"
  status = 200

[[redirects]]
  from = "/stats"
  to = "/.netlify/functions/stats"
  status = 200

# Static files (og-image.jpg, error_page.html) are served automatically —
# no explicit rule needed; a self-redirect would loop and return 502.

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/go"
  status = 200